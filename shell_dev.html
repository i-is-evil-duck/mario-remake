<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Super Mario World</title>
    <style>
      body { margin: 0; padding: 0; background: #000; overflow: hidden; }
      canvas { display: block; margin: 0 auto; background: #000; }
      #console { position: fixed; bottom: 0; left: 0; right: 0; height: 150px;
                 background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace;
                 font-size: 12px; padding: 8px; overflow-y: auto; box-sizing: border-box;
                 border-top: 1px solid #333; }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <textarea id="console" rows="8" readonly></textarea>
    <script type='text/javascript'>
      var canvasElement = document.getElementById('canvas');
      var consoleElement = document.getElementById('console');
      canvasElement.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

#if MODULARIZE && !EXPORT_ES6
      var moduleArgs = {
#else
      var Module = {
#endif
        print(...args) {
          console.log(...args);
          if (consoleElement) {
            consoleElement.value += args.join(' ') + "\n";
            consoleElement.scrollTop = consoleElement.scrollHeight;
          }
        },
        printErr(...args) {
          console.error(...args);
          if (consoleElement) {
            consoleElement.value += args.join(' ') + "\n";
            consoleElement.scrollTop = consoleElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus(text) {},
        totalDependencies: 0,
        monitorRunDependencies(left) {}
      };
    </script>
    {{{ SCRIPT }}}
#if MODULARIZE && !EXPORT_ES6
    <script type='text/javascript'>
      {{{ EXPORT_NAME }}}(moduleArgs);
    </script>
#endif
  </body>
</html>
